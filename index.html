<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Family-card-game by SSK</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <main class="app">
      <section class="topbar">
        <div>
          <p class="eyebrow">Family-card-game by SSK</p>
          <h1>カードバトル</h1>
        </div>
        <button id="resetButton" class="icon-button" type="button" aria-label="リセット" title="リセット">↻</button>
      </section>

      <section class="import-screen">
        <div>
          <h2>カードJSONを読み込む</h2>
          <p id="poolSummary">ルミナビーストのバトル用JSONを選んでください。</p>
        </div>
        <label class="file-button">
          JSONを選ぶ
          <input id="jsonInput" type="file" accept="application/json,.json">
        </label>
      </section>

      <section class="settings-screen">
        <details>
          <summary>レア度の基準を設定</summary>
          <div class="settings-grid">
            <label>ノーマル<input data-balance-key="normal" type="number" min="1" value="150"></label>
            <label>レア<input data-balance-key="rare" type="number" min="1" value="200"></label>
            <label>スーパーレア<input data-balance-key="super_rare" type="number" min="1" value="300"></label>
            <label>ノーマルの進化体<input data-balance-key="normalEvolution" type="number" min="1" value="200"></label>
            <label>レアの進化体<input data-balance-key="rareEvolution" type="number" min="1" value="250"></label>
            <label>スーパーレアの進化体<input data-balance-key="superRareEvolution" type="number" min="1" value="350"></label>
            <label>進化レベル<input data-balance-key="evolutionLevel" type="number" min="0" value="35"></label>
          </div>
          <p class="settings-note">強さは HP + 攻撃 + 防御 + すばやさ で見ます。進化後も、進化前カードはコレクションに残す前提です。</p>
        </details>
      </section>

      <section id="teamScreen" class="team-screen">
        <div class="team-head">
          <div>
            <h2>チーム編成</h2>
            <p id="teamSummary">5枚まで選んで「いざ勝負」を押してください。</p>
          </div>
          <div class="mode-control" role="radiogroup" aria-label="対戦方法">
            <label><input name="battleMode" type="radio" value="cpu" checked> CP対戦</label>
            <label><input name="battleMode" type="radio" value="twoPlayer"> 二人対戦</label>
          </div>
        </div>
        <div class="deck-grid">
          <section class="deck-panel">
            <h3>自分のデッキ</h3>
            <ol id="playerDeckList" class="deck-list"></ol>
          </section>
          <section id="playerTwoDeckPanel" class="deck-panel is-hidden">
            <h3>二人目のデッキ</h3>
            <ol id="playerTwoDeckList" class="deck-list"></ol>
          </section>
        </div>
        <div class="team-actions">
          <button id="clearDeckButton" class="plain-button" type="button">デッキを空にする</button>
          <button id="startBattleButton" class="start-button" type="button">いざ勝負</button>
        </div>
      </section>

      <section id="selectScreen" class="select-screen">
        <h2 id="selectTitle">チームに入れるカード</h2>
        <div id="cardChoices" class="choice-grid"></div>
      </section>

      <section id="battleScreen" class="battle-screen is-hidden">
        <div class="battle-board">
          <article class="fighter player">
            <p class="side-label">あなた</p>
            <div id="playerCard" class="card-panel"></div>
          </article>

          <div class="turn-panel">
            <p id="turnLabel">1ターン目</p>
            <p id="statusText">スキルを選んでね</p>
          </div>

          <article class="fighter cpu">
            <p class="side-label">CPU</p>
            <div id="cpuCard" class="card-panel"></div>
          </article>
        </div>

        <div id="actionButtons" class="actions"></div>

        <section class="log-panel">
          <h2>バトルログ</h2>
          <ol id="battleLog"></ol>
        </section>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
