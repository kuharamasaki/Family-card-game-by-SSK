<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1536" role="img" aria-label="属性のステンドグラスが並ぶバトルステージ背景">
  <defs>
    <radialGradient id="wallGlow" cx="50%" cy="30%" r="70%">
      <stop offset="0" stop-color="#4d321e"/>
      <stop offset=".58" stop-color="#131018"/>
      <stop offset="1" stop-color="#050407"/>
    </radialGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#231a20"/>
      <stop offset=".55" stop-color="#0f0d12"/>
      <stop offset="1" stop-color="#030305"/>
    </linearGradient>
    <radialGradient id="fire" cx="50%" cy="45%" r="60%">
      <stop offset="0" stop-color="#ffe16f"/>
      <stop offset=".28" stop-color="#ff8b26"/>
      <stop offset=".75" stop-color="#8b1d11"/>
      <stop offset="1" stop-color="#191116"/>
    </radialGradient>
    <radialGradient id="water" cx="50%" cy="45%" r="60%">
      <stop offset="0" stop-color="#c7fbff"/>
      <stop offset=".3" stop-color="#20b6ff"/>
      <stop offset=".78" stop-color="#064b91"/>
      <stop offset="1" stop-color="#11131b"/>
    </radialGradient>
    <radialGradient id="plant" cx="50%" cy="45%" r="60%">
      <stop offset="0" stop-color="#e9ff9a"/>
      <stop offset=".3" stop-color="#58d43c"/>
      <stop offset=".78" stop-color="#17651f"/>
      <stop offset="1" stop-color="#111814"/>
    </radialGradient>
    <radialGradient id="bolt" cx="50%" cy="45%" r="60%">
      <stop offset="0" stop-color="#fff6a6"/>
      <stop offset=".3" stop-color="#ffcc29"/>
      <stop offset=".78" stop-color="#8a620d"/>
      <stop offset="1" stop-color="#181512"/>
    </radialGradient>
    <radialGradient id="star" cx="50%" cy="45%" r="60%">
      <stop offset="0" stop-color="#ffd4ff"/>
      <stop offset=".34" stop-color="#bc50ff"/>
      <stop offset=".8" stop-color="#5f168f"/>
      <stop offset="1" stop-color="#15101d"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff0a8"/>
      <stop offset=".42" stop-color="#bd821c"/>
      <stop offset=".72" stop-color="#ffe48d"/>
      <stop offset="1" stop-color="#6f4310"/>
    </linearGradient>
    <linearGradient id="curtain" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#13040b"/>
      <stop offset=".45" stop-color="#4a071f"/>
      <stop offset="1" stop-color="#12030a"/>
    </linearGradient>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="glassLead" width="46" height="62" patternUnits="userSpaceOnUse">
      <path d="M0 8 46 38M46 4 0 44M23 0v62" fill="none" stroke="#fff2a0" stroke-opacity=".2" stroke-width="1.2"/>
    </pattern>
    <pattern id="floorLines" width="84" height="70" patternUnits="userSpaceOnUse">
      <path d="M0 0h84M0 0 84 70M84 0 0 70" fill="none" stroke="#f0bd45" stroke-opacity=".22" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1024" height="1536" fill="url(#wallGlow)"/>

  <path d="M-90 0C104 30 250 40 438 6c-62 96-168 153-314 172C34 191-44 170-90 126Z" fill="url(#curtain)" stroke="url(#gold)" stroke-width="5"/>
  <path d="M1114 0C920 30 774 40 586 6c62 96 168 153 314 172 90 13 168-8 214-52Z" fill="url(#curtain)" stroke="url(#gold)" stroke-width="5"/>
  <path d="M0 0c80 72 176 112 287 120m737-120c-80 72-176 112-287 120" fill="none" stroke="#f4c75a" stroke-opacity=".6" stroke-width="2"/>

  <g opacity=".38" stroke="#fed56a" stroke-width="2">
    <path d="M90 110v900M251 150v870M432 135v900M592 135v900M773 150v870M934 110v900"/>
  </g>

  <g filter="url(#softGlow)" opacity=".58">
    <path d="M148 128 50 965h196Z" fill="#ffe39a" opacity=".23"/>
    <path d="M329 128 231 965h196Z" fill="#ffe39a" opacity=".23"/>
    <path d="M512 128 414 965h196Z" fill="#ffe39a" opacity=".25"/>
    <path d="M695 128 597 965h196Z" fill="#ffe39a" opacity=".23"/>
    <path d="M876 128 778 965h196Z" fill="#ffe39a" opacity=".23"/>
  </g>

  <g>
    <ellipse cx="148" cy="130" rx="28" ry="12" fill="#ffe8a9"/>
    <ellipse cx="329" cy="130" rx="28" ry="12" fill="#ffe8a9"/>
    <ellipse cx="512" cy="130" rx="28" ry="12" fill="#ffe8a9"/>
    <ellipse cx="695" cy="130" rx="28" ry="12" fill="#ffe8a9"/>
    <ellipse cx="876" cy="130" rx="28" ry="12" fill="#ffe8a9"/>
