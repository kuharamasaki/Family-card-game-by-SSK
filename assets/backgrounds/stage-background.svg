    <g>
      <rect x="64" y="258" width="146" height="712" rx="70" fill="url(#fire)"/>
      <rect x="64" y="258" width="146" height="712" rx="70" fill="url(#glassLead)"/>
      <text x="137" y="650" text-anchor="middle" font-family="Yu Gothic, Meiryo, sans-serif" font-size="94" font-weight="800" fill="#fff0a6">炎</text>
    </g>
    <g>
      <rect x="247" y="258" width="146" height="712" rx="70" fill="url(#water)"/>
      <rect x="247" y="258" width="146" height="712" rx="70" fill="url(#glassLead)"/>
      <text x="320" y="650" text-anchor="middle" font-family="Yu Gothic, Meiryo, sans-serif" font-size="94" font-weight="800" fill="#e5fcff">水</text>
    </g>
    <g>
      <rect x="430" y="258" width="146" height="712" rx="70" fill="url(#plant)"/>
      <rect x="430" y="258" width="146" height="712" rx="70" fill="url(#glassLead)"/>
      <text x="503" y="650" text-anchor="middle" font-family="Yu Gothic, Meiryo, sans-serif" font-size="94" font-weight="800" fill="#f0ffc0">草</text>
    </g>
    <g>
      <rect x="613" y="258" width="146" height="712" rx="70" fill="url(#bolt)"/>
      <rect x="613" y="258" width="146" height="712" rx="70" fill="url(#glassLead)"/>
      <text x="686" y="650" text-anchor="middle" font-family="Yu Gothic, Meiryo, sans-serif" font-size="94" font-weight="800" fill="#fff4ab">雷</text>
    </g>
    <g>
      <rect x="796" y="258" width="146" height="712" rx="70" fill="url(#star)"/>
      <rect x="796" y="258" width="146" height="712" rx="70" fill="url(#glassLead)"/>
      <text x="869" y="650" text-anchor="middle" font-family="Yu Gothic, Meiryo, sans-serif" font-size="94" font-weight="800" fill="#ffe6ff">星</text>
    </g>
  </g>

  <g fill="#221614" stroke="url(#gold)" stroke-width="4">
    <rect x="41" y="205" width="24" height="848" rx="10"/>
    <rect x="220" y="205" width="24" height="848" rx="10"/>
    <rect x="403" y="205" width="24" height="848" rx="10"/>
    <rect x="586" y="205" width="24" height="848" rx="10"/>
    <rect x="769" y="205" width="24" height="848" rx="10"/>
    <rect x="952" y="205" width="24" height="848" rx="10"/>
  </g>

  <g stroke="url(#gold)" stroke-width="3" fill="none" opacity=".8">
    <path d="M112 246v-46h50v46M295 246v-46h50v46M478 246v-46h50v46M661 246v-46h50v46M844 246v-46h50v46"/>
    <path d="M120 1004c18 24 112 24 134 0M303 1004c18 24 112 24 134 0M486 1004c18 24 112 24 134 0M669 1004c18 24 112 24 134 0M852 1004c18 24 112 24 134 0"/>
  </g>

  <rect y="1010" width="1024" height="526" fill="url(#floor)"/>
  <rect y="1010" width="1024" height="526" fill="url(#floorLines)"/>
  <ellipse cx="512" cy="1148" rx="262" ry="92" fill="none" stroke="url(#gold)" stroke-width="5"/>
  <ellipse cx="512" cy="1148" rx="178" ry="60" fill="none" stroke="#f6d36d" stroke-opacity=".6" stroke-width="2"/>
  <path d="M512 1050 548 1122 628 1122 564 1168 588 1240 512 1194 436 1240 460 1168 396 1122 476 1122Z" fill="#f7d85a" fill-opacity=".24" stroke="#ffec9a" stroke-width="3"/>

  <g fill="#141014" stroke="url(#gold)" stroke-width="4">
    <path d="M198 1345h628v34H198z"/>
    <path d="M154 1379h716v36H154z"/>
    <path d="M108 1415h808v38H108z"/>
    <path d="M58 1453h908v44H58z"/>
  </g>

  <rect width="1024" height="1536" fill="#000" opacity=".22"/>
</svg>
